# Server Configuration
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://vm-243:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Liquibase Configuration - Automatic Database Migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Application Name
spring.application.name=Travel Reimbursement System

# Logging
logging.level.root=INFO
logging.level.com.example.travelreimbursement=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwt.secret=mySecureSecretKeyForJWTTokenGenerationAndValidation1234567890123456789
app.jwt.expiration=86400000

# File Storage Configuration
# Can be overridden via environment variable: FILE_STORAGE_PATH
file.storage.path=${FILE_STORAGE_PATH:/var/travel-reimbursement/documents}

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
