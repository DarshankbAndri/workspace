# Server Configuration
server.port=4200
server.servlet.context-path=/api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://vm-243:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Liquibase Configuration - Automatic Database Migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Application Name
spring.application.name=CMMS

# Logging
logging.level.root=INFO
logging.level.com.example.cmmsApplication=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwt.secret=mySecureSecretKeyForJWTTokenGenerationAndValidation1234567890123456789
app.jwt.expiration=86400000

# CMMS Security Configuration
cmms.security.api-permission-restriction-enabled=false
cmms.approval.enabled=true

# CMMS Notification Configuration
cmms.notification.enabled=true
cmms.notification.in-app-enabled=true
cmms.notification.email-enabled=false
cmms.notification.pm-due-reminder-enabled=true
cmms.notification.overdue-request-enabled=true
cmms.notification.approval-pending-enabled=true
cmms.notification.pm-reminder-days=3
cmms.notification.scan-cron=0 0 7 * * *
cmms.notification.pm-recipient-role-codes=ADMIN,SUPER_ADMIN,MAINTENANCE_MANAGER
cmms.notification.overdue-recipient-role-codes=ADMIN,SUPER_ADMIN,MAINTENANCE_MANAGER
cmms.notification.approval-fallback-role-codes=ADMIN,SUPER_ADMIN
cmms.notification.from-address=cmms@localhost

# Optional email notification SMTP settings. Keep cmms.notification.email-enabled=false until SMTP is configured.
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# File Storage Configuration
# Can be overridden via environment variable: FILE_STORAGE_PATH
file.storage.path=${FILE_STORAGE_PATH:/cmms/documents}

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
