# Server Configuration
server.port=4200
server.servlet.context-path=/api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://vm-243:5432/postgres
# spring.datasource.url=jdbc:postgresql://192.168.0.110:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false
spring.transaction.default-timeout=30

# Liquibase Configuration - Automatic Database Migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Application Name
spring.application.name=CMMS

# Logging
logging.level.root=INFO
logging.level.com.example.cmmsApplication=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] correlationId=%X{correlationId:-} userId=%X{userId:-} %logger{36} - %msg%n

# Actuator / Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
cmms.observability.approval-overdue-hours=24

# JWT Configuration
app.jwt.secret=mySecureSecretKeyForJWTTokenGenerationAndValidation1234567890123456789
app.jwt.expiration=86400000

# CMMS Security Configuration
cmms.security.api-permission-restriction-enabled=true
cmms.security.deny-unmapped-api=true
cmms.security.public-api-patterns=/api/auth/**,/api/actuator/**,/api/swagger-ui/**,/api/swagger-ui.html,/api/swagger-resources/**,/api/v3/api-docs/**,/api/company/logo/**,/api/error,/auth/**,/actuator/**,/swagger-ui/**,/swagger-ui.html,/swagger-resources/**,/v3/api-docs/**,/company/logo/**,/error
cmms.approval.enabled=true

# CMMS Notification Configuration
cmms.notification.enabled=true
cmms.notification.in-app-enabled=true
cmms.notification.email-enabled=false
cmms.notification.pm-due-reminder-enabled=true
cmms.notification.overdue-request-enabled=true
cmms.notification.approval-pending-enabled=true
cmms.notification.pm-reminder-days=3
cmms.notification.scan-cron=0 0 7 * * *
cmms.notification.pm-recipient-role-codes=ADMIN,SUPER_ADMIN,MAINTENANCE_MANAGER
cmms.notification.overdue-recipient-role-codes=ADMIN,SUPER_ADMIN,MAINTENANCE_MANAGER
cmms.notification.approval-fallback-role-codes=ADMIN,SUPER_ADMIN
cmms.notification.from-address=cmms@localhost

# Maintenance Checklist Configuration
cmms.maintenance.checklist.enabled=true
cmms.maintenance.checklist.require-required-steps-before-completion=true
cmms.maintenance.checklist.proof-uploads-enabled=true
cmms.maintenance.checklist.require-proof-when-step-requires-proof=true
cmms.maintenance.checklist.max-proof-file-size-mb=10
cmms.maintenance.checklist.allowed-proof-content-types=image/png,image/jpeg,image/webp,application/pdf

# Optional email notification SMTP settings. Keep cmms.notification.email-enabled=false until SMTP is configured.
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# File Storage Configuration
# Can be overridden via environment variable: FILE_STORAGE_PATH
file.storage.path=${FILE_STORAGE_PATH:/cmms/documents}

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
