# Production profile

cmms.security.api-permission-restriction-enabled=${CMMS_API_PERMISSION_RESTRICTION_ENABLED:true}
cmms.security.deny-unmapped-api=${CMMS_DENY_UNMAPPED_API:true}
cmms.cors.allowed-origin-patterns=${CMMS_CORS_ALLOWED_ORIGIN_PATTERNS:https://your-frontend-domain.example}
cmms.cors.allow-credentials=${CMMS_CORS_ALLOW_CREDENTIALS:true}
cmms.openapi.server-url=${CMMS_OPENAPI_SERVER_URL:/api}
cmms.openapi.server-description=${CMMS_OPENAPI_SERVER_DESCRIPTION:Production API}

logging.level.com.example.cmmsApplication=${CMMS_APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${CMMS_SECURITY_LOG_LEVEL:INFO}
